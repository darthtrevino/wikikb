updates:
- directory: /
  groups:
    root-development-dependencies:
      dependency-type: development
  # Type against the minimum supported Node.js runtime. Raise this only when
  # engines, CI, workflows, and documentation move off Node.js 22 together.
  ignore:
  - dependency-name: "@types/node"
    update-types:
    - "version-update:semver-major"
  package-ecosystem: npm
  schedule:
    interval: weekly
- directory: /
  groups:
    github-actions:
      patterns:
      - "*"
  ignore:
  - dependency-name: "github/gh-aw-actions" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  package-ecosystem: github-actions
  schedule:
    interval: weekly
version: 2
