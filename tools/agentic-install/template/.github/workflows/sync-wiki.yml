name: Sync Wiki Content

on:
  # After compile-kb updates the wiki
  workflow_run:
    workflows: ["Compile Knowledge Base", "Remember Knowledge"]
    types: [completed]
  # Manual trigger
  workflow_dispatch: {}
  # Hourly sync
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wikikb-wiki-mirror-sync
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.private == true && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Clone wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GIT_AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $GIT_AUTH"
          export GIT_TERMINAL_PROMPT=0
          git clone "https://github.com/${{ github.repository }}.wiki.git" /tmp/wiki --depth=1

      - name: Sync wiki content to repo
        run: |
          test -d /tmp/wiki/.git
          mkdir -p wiki-mirror
          rsync -a --delete --exclude='.git' /tmp/wiki/ wiki-mirror/
          echo "Synced $(find wiki-mirror -name '*.md' | wc -l) wiki pages"

      - name: Open or update mirror pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SYNC_BRANCH: wikikb/wiki-mirror-sync
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$SYNC_BRANCH" "origin/$BASE_BRANCH"
          git add wiki-mirror/
          if git diff --cached --quiet; then
            echo "No changes to sync"
            exit 0
          fi
          git commit -m "sync: update wiki-mirror from live wiki"
          remote_sha="$(git ls-remote --heads origin "refs/heads/$SYNC_BRANCH" | awk '{print $1}')"
          git push "--force-with-lease=refs/heads/$SYNC_BRANCH:$remote_sha" origin "HEAD:refs/heads/$SYNC_BRANCH"
          existing="$(gh pr list --head "$SYNC_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --head "$SYNC_BRANCH" \
              --base "$BASE_BRANCH" \
              --title "sync: update wiki mirror" \
              --body "Automated reviewable sync from the live GitHub wiki."
          else
            echo "Updated pull request #$existing"
          fi
